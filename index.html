<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baile de Munique | FC26 Pro Clubs</title>
    <script>
        // Corrige erro do GitHub Pages: força barra no final da URL para não quebrar caminhos relativos
        if (window.location.hostname.includes("github.io") && !window.location.pathname.endsWith('/')) {
            window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
        }
    </script>
    <!-- Base -->
    <link rel="stylesheet" href="src/css/main.css">
    <!-- Components -->
    <link rel="stylesheet" href="src/css/components/header.css">
    <link rel="stylesheet" href="src/css/components/footer.css">
    <link rel="stylesheet" href="src/css/components/buttons.css">
    <link rel="stylesheet" href="src/css/components/cards.css">
    <!-- Pages -->
    <link rel="stylesheet" href="src/css/pages/home.css">
    <link rel="stylesheet" href="src/css/pages/elenco.css">
    <link rel="stylesheet" href="src/css/pages/jogos.css">
    <link rel="stylesheet" href="src/css/pages/estatisticas.css">
    <link rel="stylesheet" href="src/css/pages/pesquisa.css">
    <link rel="stylesheet" href="src/css/pages/noticias.css">

</head>
<body>
    <header class="header">
        <div class="header__inner">
            <a href="#home" class="logo-container" data-route="home" aria-label="Ir para Home">
                <!-- Escudo Baile de Munique -->
                <img src="src/assets/img/EscudoBM.jpeg" alt="Escudo Baile de Munique" class="logo">
                <h1>Baile de Munique</h1>
            </a>

            <nav class="navbar" role="navigation" aria-label="Menu principal">
                <ul class="nav-links">
                    <li><a href="#home" data-route="home">Home</a></li>
                    <li><a href="#elenco" data-route="elenco">Elenco</a></li>
                    <li><a href="#noticias" data-route="noticias">Notícias</a></li>
                    <li><a href="#jogos" data-route="jogos">Últimos Jogos</a></li>
                    <li><a href="#estatisticas" data-route="estatisticas">Estatísticas</a></li>
                    <li><a href="#pesquisa" data-route="pesquisa">Pesquisa de Elenco</a></li>
                </ul>
            </nav>

            <div class="header__actions" style="display: flex; gap: var(--spacing-sm); align-items: center;">
                <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema" title="Alternar entre modo claro e escuro">
                    <svg id="theme-icon-sun" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>

                <button class="hamburger" aria-label="Abrir menu de navegação" aria-expanded="false">
                    <span class="hamburger__line"></span>
                    <span class="hamburger__line"></span>
                    <span class="hamburger__line"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- O conteúdo de cada página será injetado aqui via JS -->
    <main id="app-content">
        <section id="home-view" class="view-section">
            <h2>Bem-vindo ao Baile</h2>
            <p>Acompanhe a trajetória da nossa equipe dominando a formação 1-4-2-3-1.</p>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__socials">
            <a href="https://www.instagram.com/bailedemunichofc/" target="_blank" rel="noopener noreferrer" aria-label="Instagram do Baile de Munique" class="footer__social-link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
                </svg>
            </a>
            <a href="https://twitch.tv/oboueri" target="_blank" rel="noopener noreferrer" aria-label="Twitch do Baile de Munique" class="footer__social-link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
                </svg>
            </a>
        </div>
        
        <!-- Indicador visual de atualização via Actions -->
        <div class="update-status">
            <span id="last-update">Última atualização de dados: Carregando...</span>
            <span id="update-error" style="display: none; color: red;" title="Falha no script Python">⚠️ Falha de Sincronia</span>
        </div>
    </footer>

    <!-- Chart.js para gráficos da Pesquisa de Elenco -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <!-- Scripts modularizados -->
    <script type="module" src="src/js/app.js"></script>
</body>
</html>
