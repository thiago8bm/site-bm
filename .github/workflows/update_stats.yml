name: Atualizar Estatísticas EA

on:
  # schedule:
  #   # Roda todo dia às 05h00 UTC (02h00 no Horário de Brasília)
  #   - cron: '0 5 * * *'
  workflow_dispatch: # Permite execução manual pela aba Actions

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Executar scripts de raspagem e processamento
        run: |
          python scripts/fetch_ea_data.py
          python scripts/process_stats.py

      - name: Commit e Push das alterações
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/processed/
          git commit -m "Automated: Atualização diária de estatísticas do Baile de Munique" || echo "Nenhuma alteração para commitar"
          git push origin main