<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>BM QA Runner — Testes E2E Frontend (FC 27 & FC 26)</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #111; color: #eee; padding: 24px; margin: 0; }
        h1 { color: #C8102E; margin-bottom: 8px; }
        .summary { padding: 12px 16px; border-radius: 8px; background: #1e1e1e; margin-bottom: 16px; font-weight: bold; }
        .log-item { padding: 6px 10px; border-bottom: 1px solid #2a2a2a; font-family: monospace; font-size: 13px; }
        .pass { color: #2ecc71; }
        .fail { color: #e74c3c; font-weight: bold; }
        iframe { width: 100%; height: 480px; border: 2px solid #333; border-radius: 8px; margin-top: 16px; background: #000; }
    </style>
</head>
<body>
    <h1>🧪 Bateria de Testes E2E — Baile de Munique (FC 27 & FC 26)</h1>
    <div class="summary" id="summary">Executando bateria de testes...</div>
    <div id="results"></div>
    <iframe id="app-frame" src="../index.html#home"></iframe>

    <script type="module">
        const resultsEl = document.getElementById('results');
        const summaryEl = document.getElementById('summary');
        const frame = document.getElementById('app-frame');
        let passed = 0;
        let failed = 0;

        function assert(cond, msg) {
            const div = document.createElement('div');
            div.className = 'log-item ' + (cond ? 'pass' : 'fail');
            div.textContent = (cond ? '✓ [PASS] ' : '✗ [FAIL] ') + msg;
            resultsEl.appendChild(div);
            if (cond) passed++; else failed++;
        }

        const wait = (ms) => new Promise(r => setTimeout(r, ms));

        frame.addEventListener('load', async () => {
            const win = frame.contentWindow;
            const doc = frame.contentDocument;

            // Limpa estado para simular 1º acesso
            win.localStorage.removeItem('bm_season');
            // Importa os m?dulos DENTRO do iframe (mesma inst?ncia usada pela SPA), com URLs absolutas
            const root = new URL('../', location.href).href;
            const { appMod, apiMod, newsMod } = await new Promise((resolve, reject) => {
                const key = '__bmQa' + Date.now();
                win[key + 'ok'] = resolve;
                win[key + 'err'] = reject;
                const s = doc.createElement('script');
                s.type = 'module';
                s.textContent = `
                    Promise.all([
                        import('${root}src/js/app.js'),
                        import('${root}src/js/api.js'),
                        import('${root}src/js/pages/noticias.js')
                    ]).then(([appMod, apiMod, newsMod]) => window['${key}ok']({ appMod, apiMod, newsMod }))
                      .catch(e => window['${key}err'](e));`;
                doc.head.appendChild(s);
            });

            // 1. Estado padrão (FC 27)
            appMod.switchSeason('fc27');
            await wait(300);
            assert(apiMod.getActiveSeason() === 'fc27', '1. Temporada padrão inicial é fc27');
            assert(doc.querySelector('.season-btn[data-season="fc27"]')?.classList.contains('active'), '2. Botão FC 27 no Header está ativo');
            assert(doc.title.includes('FC27'), '3. <title> reflete FC27');

            // 2. Navegação pelas views no FC 27 (Empty States)
            appMod.navigateTo('home');
            await wait(300);
            assert(doc.getElementById('home-view')?.innerHTML.includes('Pro Clubs · FC27'), '4. Home no FC 27 exibe subtítulo Pro Clubs · FC27');
            assert(!doc.querySelector('.legacy-banner'), '5. Home no FC 27 não exibe banner de legado');

            appMod.navigateTo('elenco');
            await wait(300);
            assert(doc.querySelector('#elenco-view .empty-state--season') !== null, '6. Elenco no FC 27 exibe Empty State elegante');

            appMod.navigateTo('jogos');
            await wait(300);
            assert(doc.querySelector('#jogos-view .empty-state--season') !== null, '7. Jogos no FC 27 exibe Empty State elegante');

            appMod.navigateTo('estatisticas');
            await wait(300);
            assert(doc.querySelector('#estatisticas-view .empty-state--season') !== null, '8. Estatísticas no FC 27 exibe Empty State elegante');

            appMod.navigateTo('pesquisa');
            await wait(300);
            const btnSwitch = doc.querySelector('#pesquisa-view #btn-switch-fc26');
            assert(btnSwitch !== null, '9. Pesquisa no FC 27 exibe Empty State com botão de transição para FC 26');

            // 3. Clicar no CTA para alternar para FC 26
            btnSwitch?.click();
            await wait(450);
            assert(apiMod.getActiveSeason() === 'fc26', '10. Clique no botão de Empty State alternou temporada para fc26');
            assert(doc.querySelector('#pesquisa-view .campinho') !== null, '11. Pesquisa no FC 26 renderizou campinho tático 1-4-2-3-1');
            assert(doc.querySelector('#pesquisa-view #chart-capitaes') !== null, '12. Pesquisa no FC 26 renderizou gráficos Chart.js');

            // 4. Verificar dados reais do FC 26 nas demais abas
            appMod.navigateTo('home');
            await wait(300);
            assert(doc.querySelector('.legacy-banner') !== null, '13. Home no FC 26 exibe banner de arquivo histórico (.legacy-banner)');

            appMod.navigateTo('elenco');
            await wait(300);
            const playerCards = doc.querySelectorAll('#elenco-view .player-card');
            assert(playerCards.length >= 8, `14. Elenco no FC 26 renderizou ${playerCards.length} cards de jogadores`);

            appMod.navigateTo('jogos');
            await wait(300);
            const matchCards = doc.querySelectorAll('#jogos-view .match-card');
            assert(matchCards.length > 0, `15. Jogos no FC 26 renderizou ${matchCards.length} partidas`);

            appMod.navigateTo('estatisticas');
            await wait(300);
            assert(doc.querySelectorAll('#estatisticas-view .stat-card').length >= 4, '16. Estatísticas no FC 26 renderizou cards de resumo do clube');

            // 5. Testar Filtros de Notícias e Prevenção de Duplicação do Lightbox
            appMod.navigateTo('noticias');
            await wait(400);
            const parsedLegacy = newsMod.parseEdition('TheFicientsNews_20ed_0209.jpg');
            const parsedNew = newsMod.parseEdition('fc27_edicao1_2026-10-15_Estreia-Historica.jpg');
            assert(parsedLegacy.jogo === 'fc26' && parsedLegacy.mesAno === '09/2026', '17. parseEdition classifica formato antigo como fc26 (09/2026)');
            assert(parsedNew.jogo === 'fc27' && parsedNew.mesAno === '10/2026', '18. parseEdition classifica edição pós-outubro/prefixo como fc27 (10/2026)');

            const btnFilterFc27 = doc.querySelector('#noticias-view [data-jogo="fc27"]');
            btnFilterFc27?.click();
            await wait(200);
            assert(doc.querySelectorAll('#noticias-view .noticia-card').length === 0, '19. Filtro Notícias EA FC 27 filtra corretamente edições de 2025/2026');

            const btnFilterFc26 = doc.querySelector('#noticias-view [data-jogo="fc26"]');
            btnFilterFc26?.click();
            await wait(200);
            assert(doc.querySelectorAll('#noticias-view .noticia-card').length >= 30, '20. Filtro Notícias EA FC 26 exibe todas as 33 edições históricas');

            // Troca de temporada estando em #noticias para verificar se o #lightbox não duplica
            appMod.switchSeason('fc27');
            await wait(350);
            const lightboxesInDom = doc.querySelectorAll('#lightbox');
            assert(lightboxesInDom.length === 1, `21. Alternar temporada em #noticias mantém exatamente 1 #lightbox no DOM (encontrados: ${lightboxesInDom.length})`);

            summaryEl.innerHTML = `Resultado Final: <span class="pass">${passed} aprovados</span> · <span class="${failed ? 'fail' : 'pass'}">${failed} falhas</span>`;
        });
    </script>
</body>
</html>
